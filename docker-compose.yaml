version: '3.8'

networks:
  lamarato-beacon-network:

x-environment: &env
  - POSTGRES_USER=postgres
  - POSTGRES_PASSWORD=postgres
  - POSTGRES_BN_DATABASE=beacon-network
  - BEACON_NETWORK_CONFIG_DIR=/wildfly/BEACON-INF
  - BEACON_NETWORK_DB_CONNECTION_URL=jdbc:postgresql://postgreslamarato:5432/beacon-network
  - BEACON_NETWORK_DB_USERNAME=beacon
  - BEACON_NETWORK_DB_PASSWORD=beacon
  - JBOSS_JAVA_SIZING=-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Xms128m
services:
  postgreslamarato:
    image: postgres:16.0-alpine
    container_name: "lamarato-bn-db"
    restart: always
    environment: *env
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./postgresql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - lamarato-beacon-network
  wildflylamarato:
    image: ghcr.io/elixir-europe/beacon-network-backend:latest
    container_name: "lamarato-bn-server"
    depends_on:
      - postgreslamarato
    restart: always
    volumes:
      - ./wildfly/BEACON-INF:/wildfly/BEACON-INF
    hostname: wildfly
    networks:
      - lamarato-beacon-network
    ports:
      - '8093:8080'
    environment: *env